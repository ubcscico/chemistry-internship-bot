name: Chemistry Internship Scraper

on:
  schedule:
    - cron: '0 14 * * *'  # Runs daily
  workflow_dispatch:      # Allows manual trigger

permissions:
  contents: write         # Allows the workflow to push cache changes

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Chemistry Scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python chem_bot.py

      - name: Commit and Push Updated Cache
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated cache update [skip ci]"
          file_pattern: "seen_chem_jobs.json"
